<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Curator — Low Confidence Roles</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .role { border: 1px solid #ddd; padding: 12px; margin: 8px 0; }
    .meta { color: #666; font-size: 0.9em; }
    button { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Curator — Low Confidence Roles</h1>
  <div>
    <label>Confidence threshold: <input id="threshold" value="0.6" step="0.05" type="number" min="0" max="1"></label>
    <button onclick="loadRoles()">Load</button>
  </div>
  <div id="list"></div>

  <script>
    async function loadRoles() {
      const threshold = parseFloat(document.getElementById('threshold').value) || 0.6;
      const res = await fetch(`/api/v1/curator/low-confidence?threshold=${threshold}`);
      const body = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = '';
      body.roles.forEach(r => {
        const el = document.createElement('div');
        el.className = 'role';
        el.innerHTML = `<strong>${r.canonical_title}</strong> <div class="meta">id: ${r.role_id} • sector: ${r.sector} • confidence: ${r.confidence_score}</div>
          <div>${r.description || ''}</div>
          <div style="margin-top:6px">
            <button onclick="approve('${r.role_id}', this)">Approve</button>
            <a href="${r.sample_job_postings && r.sample_job_postings[0] && r.sample_job_postings[0].url}" target="_blank">source</a>
          </div>`;
        list.appendChild(el);
      });
    }

    async function approve(role_id, btn) {
      btn.disabled = true;
      const form = new FormData();
      form.append('role_id', role_id);
      const res = await fetch('/api/v1/curator/approve', { method: 'POST', body: form });
      if (res.ok) {
        btn.textContent = 'Approved';
      } else {
        btn.textContent = 'Error';
      }
    }

    // load initial
    loadRoles();
  </script>
</body>
</html>
